name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { 'v${{ inputs.version }}' }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Expected a version like 1.0.0, got '$version'" }
          "tag=$tag"         | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "Building $tag (assembly version $version)"

      - name: Test
        run: dotnet test Translator.sln -c Release

      # Publishes, checks the payload, and builds the zip and the installer from the same files.
      # The PR installer job runs the same script, so this is what the PR tested.
      - name: Build zip and installer
        shell: pwsh
        run: ./build/Build-Release.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ steps.v.outputs.tag }}"
          "artifacts/Translator-${{ steps.v.outputs.version }}-win-x64.zip"
          "artifacts/Translator-${{ steps.v.outputs.version }}-win-x64-setup.exe"
          --title "${{ steps.v.outputs.tag }}"
          --generate-notes
